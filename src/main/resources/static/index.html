<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Data KTP - Praktikum</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #007bff; }

    /* Form Styling */
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], input[type="date"], textarea, select {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
    }

    .btn-group { display: flex; gap: 10px; }
    button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn-save { background-color: #28a745; color: white; width: 100%; }
    .btn-save:hover { background-color: #218838; }
    .btn-edit { background-color: #ffc107; color: black; }
    .btn-delete { background-color: #dc3545; color: white; }
    .btn-cancel { background-color: #6c757d; color: white; }

    /* Table Styling */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }

    /* Notification */
    #notification { padding: 10px; margin-bottom: 20px; border-radius: 5px; display: none; text-align: center; font-weight: bold; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div class="container">
  <h2>Form Input Data KTP</h2>
  <div id="notification"></div>

  <form id="ktpForm">
    <input type="hidden" id="id">
    <div class="form-group">
      <label>NIK:</label>
      <input type="text" id="nik" placeholder="Masukkan 16 digit NIK" required>
    </div>
    <div class="form-group">
      <label>Nama Lengkap:</label>
      <input type="text" id="namaLengkap" placeholder="Nama sesuai identitas" required>
    </div>
    <div class="form-group">
      <label>Alamat:</label>
      <textarea id="alamat" rows="3" placeholder="Alamat lengkap saat ini"></textarea>
    </div>
    <div class="form-group">
      <label>Tanggal Lahir:</label>
      <input type="date" id="tanggalLahir" required>
    </div>
    <div class="form-group">
      <label>Jenis Kelamin:</label>
      <select id="jenisKelamin">
        <option value="Laki-laki">Laki-laki</option>
        <option value="Perempuan">Perempuan</option>
      </select>
    </div>
    <button type="submit" class="btn-save" id="btnSimpan">Simpan Data</button>
    <button type="button" class="btn-cancel" id="btnBatal" style="display:none; margin-top:10px; width: 100%;">Batal Edit</button>
  </form>

  <h2>Daftar KTP Tercatat</h2>
  <table>
    <thead>
    <tr>
      <th>nik</th>
      <th>Nama Lengkap</th>
      <th>Jenis Kelamin</th>
      <th>Aksi</th>
    </tr>
    </thead>
    <tbody id="ktpTableBody">
    </tbody>
  </table>
</div>

<script>
  const API_URL = "/api/ktp"; // Mengarah ke Controller Spring Boot

  $(document).ready(function() {
    loadData();

    // Operasi POST & PUT (Save/Update)
    $('#ktpForm').on('submit', function(e) {
      e.preventDefault();
      const id = $('#id').val();
      const type = id ? 'PUT' : 'POST';
      const url = id ? `${API_URL}/${id}` : API_URL;

      const ktpData = {
        nik: $('#nik').val(),
        namaLengkap: $('#namaLengkap').val(),
        alamat: $('#alamat').val(),
        tanggalLahir: $('#tanggalLahir').val(),
        jenisKelamin: $('#jenisKelamin').val()
      };

      $.ajax({
        url: url,
        type: type,
        contentType: "application/json",
        data: JSON.stringify(ktpData),
        success: function(response) {
          showNotification("Data berhasil disimpan!", "success");
          resetForm();
          loadData();
        },
        error: function(err) {
          showNotification("Gagal menyimpan data: " + err.responseText, "error");
        }
      });
    });

    $('#btnBatal').click(function() {
      resetForm();
    });
  });

  // Operasi GET
  function loadData() {
    $.ajax({
      url: API_URL,
      type: 'GET',
      success: function(data) {
        let rows = '';
        data.forEach(ktp => {
          rows += `
                        <tr>
                            <td>${ktp.nik}</td>
                            <td>${ktp.namaLengkap}</td>
                            <td>${ktp.jenisKelamin}</td>
                            <td>
                                <button class="btn-edit" onclick="editData(${ktp.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteData(${ktp.id})">Hapus</button>
                            </td>
                        </tr>
                    `;
        });
        $('#ktpTableBody').html(rows);
      },
      error: function() {
        showNotification("Gagal mengambil data dari server.", "error");
      }
    });
  }

  // Operasi DELETE
  function deleteData(id) {
    if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
      $.ajax({
        url: `${API_URL}/${id}`,
        type: 'DELETE',
        success: function() {
          showNotification("Data berhasil dihapus!", "success");
          loadData();
        },
        error: function() {
          showNotification("Gagal menghapus data.", "error");
        }
      });
    }
  }

  // Mengisi form untuk Update
  function editData(id) {
    $.get(`${API_URL}/${id}`, function(data) {
      $('#id').val(data.id);
      $('#nik').val(data.nik);
      $('#namaLengkap').val(data.namaLengkap);
      $('#alamat').val(data.alamat);
      $('#tanggalLahir').val(data.tanggalLahir);
      $('#jenisKelamin').val(data.jenisKelamin);

      $('#btnSimpan').text("Perbarui Data").css("background-color", "#ffc107").css("color", "black");
      $('#btnBatal').show();
      window.scrollTo(0, 0);
    });
  }

  function showNotification(msg, type) {
    $('#notification').text(msg).addClass(type).fadeIn();
    setTimeout(() => {
      $('#notification').fadeOut().removeClass(type);
    }, 3000);
  }

  function resetForm() {
    $('#ktpForm')[0].reset();
    $('#id').val('');
    $('#btnSimpan').text("Simpan Data").css("background-color", "#28a745").css("color", "white");
    $('#btnBatal').hide();
  }
</script>

</body>
</html>
